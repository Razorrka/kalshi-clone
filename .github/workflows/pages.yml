name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/jit-coin-simulation-wbr7e6
  workflow_dispatch:

# Needed by actions/deploy-pages to publish and to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should not reach the home screen.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # No enablement: true here. The Actions token is not allowed to create a
      # Pages site, and asking it to turns a clear "enable Pages first" error
      # into an opaque "Resource not accessible by integration" one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
